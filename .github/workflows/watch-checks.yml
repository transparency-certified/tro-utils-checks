# Find out, on a schedule, whether the checks on tro-checks' main branch say something different
# about the pinned tro-utils than the checks at the commit the Dockerfile pins, and file an issue
# where they do.
#
# The image imports tro-checks, and with it the versions of the TRACE Specification the checks come
# from, at the commit TRO_CHECKS_VERSION in the Dockerfile names, so the other workflows see new
# checks only when that pin is moved. tro-checks' main moves often, and trace-main says of itself
# that it "changes frequently". This builds the image with main's latest commit in place of the pin
# and compares what it makes with what is committed. It builds every layer afresh rather than
# reusing the cache the other workflows fill, so that it also notices the unpinned parts of the
# image moving; the issue says so where the candidates differ, since the checks cannot change those.
#
# Nothing is committed here. The issue is the notification; moving to the new checks is a pull
# request that moves the pin, and Regenerate makes the candidates and the reports for it.

name: Watch checks

on:
  schedule:
    # Mondays, early. Any hour off the hour, since the scheduler is busiest on it.
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: watch-checks
  cancel-in-progress: false

env:
  # Who the issue is assigned to, and the label that finds it again so that a change that lasts
  # weeks is commented on rather than filed afresh every Monday.
  ISSUE_ASSIGNEE: Xarthisius
  ISSUE_LABEL: conformance-drift

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      # The whole history, so that review-ledger can resolve the commits it recorded reviews at.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Find tro-checks' latest commit
        id: tro-checks
        run: |
          sha="$(git ls-remote https://github.com/transparency-certified/tro-checks.git refs/heads/main | cut -f1)"
          [ -n "$sha" ] || { echo "Could not resolve tro-checks' main." >&2; exit 1; }
          echo "main=${sha}" >> "$GITHUB_OUTPUT"
          echo "pinned=$(make -s print-tro-checks-version 2>/dev/null)" >> "$GITHUB_OUTPUT"

      - id: regenerate
        uses: ./.github/actions/regenerate
        with:
          no-cache: true
          tro-checks-version: ${{ steps.tro-checks.outputs.main }}

      # Added to the index first, so that a report that is new rather than changed counts too.
      - name: Say whether anything differs
        id: drift
        run: |
          git add --intent-to-add --all -- candidates reports
          if git diff --quiet -- candidates reports; then
            echo 'differs=false' >> "$GITHUB_OUTPUT"
          else
            echo 'differs=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Describe what differs
        if: steps.drift.outputs.differs == 'true'
        env:
          VERSION: ${{ steps.regenerate.outputs.tro-utils-version }}
          PINNED: ${{ steps.tro-checks.outputs.pinned }}
          MAIN: ${{ steps.tro-checks.outputs.main }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: .github/scripts/describe-check-drift "$VERSION" "$PINNED" "$MAIN" "$RUN_URL" > /tmp/issue-body.md

      # Commented on rather than filed again where one is already open, so that a change nobody has
      # got to yet does not become an issue a week.
      - name: File or update the issue
        if: steps.drift.outputs.differs == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.regenerate.outputs.tro-utils-version }}
        run: |
          gh label create "$ISSUE_LABEL" --force --color D93F0B \
              --description 'The checks say something different about the pinned tro-utils'

          open="$(gh issue list --state open --label "$ISSUE_LABEL" --limit 1 \
                      --json number --jq '.[0].number // empty')"

          if [ -n "$open" ]; then
            gh issue comment "$open" --body-file /tmp/issue-body.md
            echo "Commented on #${open}." >> "$GITHUB_STEP_SUMMARY"
          else
            gh issue create \
                --title "The checks say something different about tro-utils ${VERSION}" \
                --body-file /tmp/issue-body.md \
                --label "$ISSUE_LABEL" \
                --assignee "$ISSUE_ASSIGNEE"
            echo 'Filed an issue.' >> "$GITHUB_STEP_SUMMARY"
          fi

      # Closed where the difference is gone, which is what merging the pull request that moves the
      # pin does. Where main has moved on without changing anything, the pin is left where it is:
      # there is nothing for a pull request to commit but the pin itself.
      - name: Close the issue where nothing differs
        if: steps.drift.outputs.differs == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.regenerate.outputs.tro-utils-version }}
          MAIN: ${{ steps.tro-checks.outputs.main }}
        run: |
          open="$(gh issue list --state open --label "$ISSUE_LABEL" --limit 1 \
                      --json number --jq '.[0].number // empty')"

          echo "The checks at tro-checks \`${MAIN}\` reach the committed conclusions about tro-utils \`${VERSION}\`." \
              >> "$GITHUB_STEP_SUMMARY"
          [ -n "$open" ] || exit 0

          gh issue close "$open" --comment \
              "The checks at tro-checks \`${MAIN}\`, built afresh, reach the conclusions this repository has committed for \`tro-utils ${VERSION}\`. Closed by the Watch checks run."

      - name: Attach the reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: reports/
