# Check that the candidates and the reports in the repository are the ones the image makes.
#
# The candidates depend on the version of tro-utils the image installs and on the version of
# libmagic it carries, and the reports depend on the candidates, so any of the three made anywhere
# else is a candidate or a report the repository cannot account for. This run remakes all of them
# in the image this checkout's Dockerfile describes and fails where what it made differs from what
# was committed.
#
# On a branch of this repository the Regenerate workflow commits the difference instead, so this
# runs on the default branch, on a pull request from a fork, which cannot be pushed to, and when
# asked for.

name: Check candidates

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # A pull request from a branch of this repository is regenerated by the Regenerate workflow,
    # whose commit this run would not see: it would report the difference that commit removes.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository
    steps:
      # The whole history, so that review-ledger can resolve the commits it recorded reviews at.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: regenerate
        uses: ./.github/actions/regenerate

      # Added to the index first, so that a candidate or a report that is new rather than changed
      # counts too.
      - name: Compare what was made with what was committed
        run: |
          git add --intent-to-add --all -- candidates reports

          version='${{ steps.regenerate.outputs.tro-utils-version }}'

          if git diff --quiet -- candidates reports; then
            echo "The candidates and the reports are the ones tro-utils \`${version}\` makes in this image." \
                >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          {
            echo "## The candidates and the reports are not the ones this image makes"
            echo
            echo "Remade with tro-utils \`${version}\`, these differ from the committed ones:"
            echo
            echo '```'
            git diff --stat -- candidates reports
            echo '```'
            echo
            echo "Push the branch again to have the Regenerate workflow commit them, or remake"
            echo "them with \`make build-candidates build-reports\` and commit the result."
          } >> "$GITHUB_STEP_SUMMARY"

          git --no-pager diff -- candidates reports
          exit 1

      - name: Show the reports
        if: always()
        run: |
          [ -f reports/integrated-report.md ] || exit 0
          cat reports/integrated-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Attach the reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: reports/
